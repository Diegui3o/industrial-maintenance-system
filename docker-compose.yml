services:
  postgres:
    image: postgres:16
    container_name: postgres_mantenimiento
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mantenimiento
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mantenimiento"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: mantenimiento_backend
    restart: always
    volumes:
      - ./whatsapp_data:/app/whatsapp_data
      - ./whatsapp_sessions:/app/whatsapp_sessions
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    ports:
      - "1883:1883"
    environment:
      DATABASE_URL: "postgres://admin:admin@postgres:5432/mantenimiento?sslmode=disable"
      FIREBASE_PROJECT_ID: "registros-actividades-mina"
      GOOGLE_APPLICATION_CREDENTIALS: "/app/secrets/firebase-service-account.json"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: mantenimiento_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data: